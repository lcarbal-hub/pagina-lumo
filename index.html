<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LÜMØ - Arte Digital para Niños</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pangolin&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lumoGold: '#F0D53E',
                        lumoBlue: '#03658C',
                        lumoCrimson: '#D93D59',
                        lumoGreen: '#4BD166',
                        lumoPurple: '#8549BA',
                        lumoBg: '#03658C'
                    },
                    fontFamily: {
                        title: ['Pangolin', 'cursive'],
                        body: ['Verdana', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Verdana', sans-serif;
            user-select: none;
        }
        .font-title {
            font-family: 'Pangolin', cursive;
        }
        .grid-paper {
            background-color: #ffffff;
            background-image: 
                linear-gradient(#e5e7eb 1px, transparent 1px),
                linear-gradient(90deg, #e5e7eb 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .card-bounce {
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .card-bounce:hover {
            transform: translateY(-5px) scale(1.02);
        }
    </style>
</head>
<body class="bg-lumoBg min-h-screen flex flex-col justify-between">

    <!-- Encabezado Único (Arriba) -->
    <header class="bg-transparent text-white px-6 py-4">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            
            <!-- Logo LÜMØ -->
            <div class="bg-white rounded-full px-4 py-1.5 shadow-md flex items-center space-x-1 cursor-pointer" onclick="switchTab('textos')">
                <span class="font-title text-2xl font-black text-lumoCrimson">L</span>
                <span class="font-title text-2xl font-black text-lumoGold">Ü</span>
                <span class="font-title text-2xl font-black text-lumoGreen">M</span>
                <span class="font-title text-2xl font-black text-lumoPurple">Ø</span>
                <i class="fa-solid fa-palette text-lumoBlue text-base ml-1"></i>
            </div>

            <!-- Entrada de Usuario -->
            <div class="flex items-center gap-2 bg-white/20 px-4 py-1.5 rounded-full border border-white/30 backdrop-blur-sm">
                <i class="fa-solid fa-user text-lumoGold"></i>
                <span class="font-title text-xs text-yellow-200 uppercase tracking-wider">USERNAME:</span>
                <input type="text" id="usernameInput" value="Artista" class="bg-transparent text-white font-title font-bold text-sm focus:outline-none w-28 border-b border-white/50 focus:border-lumoGold">
            </div>

        </div>
    </header>

    <!-- Contenido Único: Cuaderno Central -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 flex flex-col justify-center items-center">

        <div class="grid-paper w-full rounded-3xl p-6 md:p-10 border-4 border-gray-900 shadow-2xl flex flex-col items-center text-center relative">
            
            <!-- Título dentro de la hoja -->
            <div class="mb-8 w-full max-w-lg">
                <h1 class="font-title text-5xl md:text-6xl font-black text-gray-900 tracking-wider">
                    LÜMØ
                </h1>
                <div class="h-1 bg-gray-900 w-3/4 mx-auto my-2 rounded-full"></div>
                <p class="font-title text-3xl md:text-4xl font-bold text-lumoBlue mt-2">
                    ¡BIENVENIDOS!
                </p>
            </div>

            <!-- Las 3 Tarjetas de Grado -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-3xl">
                
                <!-- 1° Grado -->
                <div onclick="selectGrade(1)" class="cursor-pointer bg-white border-[3px] border-gray-900 rounded-3xl p-6 flex flex-col items-center justify-between card-bounce shadow-md">
                    <div class="relative my-2 flex justify-center items-center">
                        <span class="font-title text-7xl font-black text-gray-900 leading-none">1</span>
                        <div class="absolute top-[12px] right-[-14px] bg-white border-2 border-gray-900 rounded-full px-1 py-0.5 flex items-center gap-1 shadow-sm">
                            <div class="w-2.5 h-3.5 bg-gray-900 rounded-full flex items-center justify-center">
                                <div class="w-1 h-1 bg-white rounded-full -translate-x-0.5 -translate-y-0.5"></div>
                            </div>
                            <div class="w-2.5 h-3.5 bg-gray-900 rounded-full flex items-center justify-center">
                                <div class="w-1 h-1 bg-white rounded-full -translate-x-0.5 -translate-y-0.5"></div>
                            </div>
                        </div>
                    </div>
                    <span class="font-title text-xl font-bold text-lumoGold mt-2">1° Grado</span>
                </div>

                <!-- 2° Grado -->
                <div onclick="selectGrade(2)" class="cursor-pointer bg-white border-[3px] border-gray-900 rounded-3xl p-6 flex flex-col items-center justify-between card-bounce shadow-md">
                    <div class="relative my-2 flex justify-center items-center">
                        <span class="font-title text-7xl font-black text-gray-900 leading-none">2</span>
                        <div class="absolute top-[14px] right-[-10px] bg-white border-2 border-gray-900 rounded-full px-1 py-0.5 flex items-center gap-1 shadow-sm">
                            <div class="w-2.5 h-3.5 bg-gray-900 rounded-full flex items-center justify-center">
                                <div class="w-1 h-1 bg-white rounded-full -translate-x-0.5 -translate-y-0.5"></div>
                            </div>
                            <div class="w-2.5 h-3.5 bg-gray-900 rounded-full flex items-center justify-center">
                                <div class="w-1 h-1 bg-white rounded-full -translate-x-0.5 -translate-y-0.5"></div>
                            </div>
                        </div>
                    </div>
                    <span class="font-title text-xl font-bold text-lumoCrimson mt-2">2° Grado</span>
                </div>

                <!-- 3° Grado -->
                <div onclick="selectGrade(3)" class="cursor-pointer bg-white border-[3px] border-gray-900 rounded-3xl p-6 flex flex-col items-center justify-between card-bounce shadow-md">
                    <div class="relative my-2 flex justify-center items-center">
                        <span class="font-title text-7xl font-black text-gray-900 leading-none">3</span>
                        <div class="absolute top-[12px] right-[-10px] bg-white border-2 border-gray-900 rounded-full px-1 py-0.5 flex items-center gap-1 shadow-sm">
                            <div class="w-2.5 h-3.5 bg-gray-900 rounded-full flex items-center justify-center">
                                <div class="w-1 h-1 bg-white rounded-full -translate-x-0.5 -translate-y-0.5"></div>
                            </div>
                            <div class="w-2.5 h-3.5 bg-gray-900 rounded-full flex items-center justify-center">
                                <div class="w-1 h-1 bg-white rounded-full -translate-x-0.5 -translate-y-0.5"></div>
                            </div>
                        </div>
                    </div>
                    <span class="font-title text-xl font-bold text-lumoPurple mt-2">3° Grado</span>
                </div>

            </div>

            <p class="font-title text-base text-gray-700 mt-8 font-semibold">
                Selecciona tu grado para ingresar a la plataforma.
            </p>
        </div>

    </main>

    <!-- Pie de página -->
    <footer class="py-4 text-center text-xs text-white/80 font-body">
        <p>© 2026 LÜMØ Educativo — Arte Digital para Educación Primaria.</p>
    </footer>

    <script>
        function selectGrade(grade) {
            const user = document.getElementById('usernameInput').value.trim() || 'Artista';
            alert(`¡Hola ${user}! Has seleccionado el Grado ${grade}°. Bienvenid@ a LÜMØ.`);
        }

        function switchTab(tab) {
            console.log('Navegando a:', tab);
        }
    </script>
</body>
</html>
